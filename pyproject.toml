[project]
name = "alarm-inspection-processor"
version = "0.1.0"
description = "Deterministic processing for alarm inspection reports"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "openpyxl>=3.1"]
files = ["openpyxl>=3.1", "pandas>=2.2", "pdfplumber>=0.11"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
alarm_inspection = ["api/review.js"]
