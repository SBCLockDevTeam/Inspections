[project]
name = "alarm-inspection-processor"
version = "0.1.0"
description = "Deterministic processing for alarm inspection reports"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
files = ["openpyxl>=3.1", "pandas>=2.2", "pdfplumber>=0.11"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

