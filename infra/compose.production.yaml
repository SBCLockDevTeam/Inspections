services:
  api:
    image: ${INSPECTIONS_IMAGE:?Set INSPECTIONS_IMAGE}
    restart: unless-stopped
    env_file: .env.inspections
    ports:
      - "18080:8000"
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.inspections
    volumes:
      - inspections_postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  inspections_postgres:
