services:
  api:
    image: ${INSPECTIONS_IMAGE:?Set INSPECTIONS_IMAGE}
    restart: unless-stopped
    env_file: ../.env.inspections
    volumes:
      - inspections_uploads:/tmp/alarm-inspection-uploads
    ports:
      - "${INSPECTIONS_HTTP_BIND:-0.0.0.0}:18080:8000"
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  https:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - inspections_caddy_data:/data
      - inspections_caddy_config:/config
    depends_on:
      - api
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../.env.inspections
    volumes:
      - inspections_postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  inspections_postgres:
  inspections_uploads:
  inspections_caddy_data:
  inspections_caddy_config:
